[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-watcher"
version = "2.0.0"
description = "AI-powered intelligence report generator that monitors and analyzes AI developments, trends, and news"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AI-Watcher Team"}
]
keywords = [
    "ai",
    "artificial-intelligence",
    "news",
    "monitoring",
    "crewai",
    "agents",
    "automation",
    "intelligence-report"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]

dependencies = [
    # Core CrewAI dependencies
    "crewai>=0.150.0",
    "crewai-tools>=0.12.0",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # HTTP requests and APIs
    "requests>=2.31.0",
    # Email HTML parsing and image extraction
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "detect-secrets>=1.4.0",
    "types-requests>=2.31.0",
    "types-pyyaml>=6.0.0",
]

# Optional enhanced features
social = [
    "tweepy>=4.14.0",
]

finance = [
    "alpha-vantage>=2.3.1",
    "finnhub-python>=2.4.18",
]

nlp = [
    "textblob>=0.17.1",
    "nltk>=3.8.1",
]

data = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

# Install all optional features
all = [
    "ai-watcher[social,finance,nlp,data]",
]

[project.urls]
Homepage = "https://github.com/ai-watcher/ai-watcher"
Documentation = "https://github.com/ai-watcher/ai-watcher#readme"
Repository = "https://github.com/ai-watcher/ai-watcher"
Issues = "https://github.com/ai-watcher/ai-watcher/issues"

[project.scripts]
ai-watcher = "ai_watcher.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_watcher*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
    "C901",   # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["ai_watcher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "crewai_tools.*",
    "bs4.*",
    "lxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ai_watcher"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true
